experiment: spatial_baseline_smoke_test

data:
  manifest: data/interim/manifest_spatial_baseline.csv
  frames_per_video: 10
  crop_size: 224
  train_split: data/splits/spatial_baseline_train.csv   # 40 videos: 20 real + 20 fake -> 389 frames
  val_split: data/splits/spatial_baseline_val.csv        # 10 videos: 5 real + 5 fake  -> 96 frames
  # frame counts are lower than frames_per_video * video_count because ~3% of
  # sampled frames had no face detected (see data/interim/face_detection_log.csv)

model:
  backbone: resnet18
  pretrained: true
  freeze_backbone: false
  num_classes: 1        # binary, sigmoid via BCEWithLogitsLoss

train:
  epochs: 5
  batch_size: 16
  optimizer: adam
  lr: 1.0e-4
  loss: bce_with_logits
  seed: 42
  device: cpu            # explicit: this session runs on Windows/CPU, not the
                          # M3 Mac the original plan assumed (no MPS backend here)

output:
  checkpoint_dir: results/checkpoints/spatial_baseline_smoke_test/
  log_dir: results/logs/spatial_baseline_smoke_test/
