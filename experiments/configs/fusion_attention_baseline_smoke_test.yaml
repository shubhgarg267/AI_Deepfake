experiment: fusion_attention_baseline_smoke_test

data:
  manifest: data/interim/manifest_fusion_baseline.csv
  train_split: data/splits/spatial_baseline_train.csv   # reused: same 50-video split, 40 train
  val_split: data/splits/spatial_baseline_val.csv        # 10 val

model:
  fusion_type: attention
  spatial_dim: 512
  freq_dim: 128
  temporal_dim: 128
  proj_dim: 128            # attention-only: common projection dim
  num_classes: 1

train:
  epochs: 5
  batch_size: 8             # same as temporal: only 40 train examples
  optimizer: adam
  lr: 1.0e-4
  loss: bce_with_logits
  seed: 42
  device: cpu

output:
  checkpoint_dir: results/checkpoints/fusion_attention_baseline_smoke_test/
  log_dir: results/logs/fusion_attention_baseline_smoke_test/
