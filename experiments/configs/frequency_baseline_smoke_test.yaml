experiment: frequency_baseline_smoke_test

data:
  manifest: data/interim/manifest_frequency_baseline.csv
  train_split: data/splits/spatial_baseline_train.csv   # reused: same 50-video split as spatial baseline
  val_split: data/splits/spatial_baseline_val.csv

model:
  backbone: frequency_small_cnn
  num_classes: 1        # binary, sigmoid via BCEWithLogitsLoss

train:
  epochs: 5
  batch_size: 16
  optimizer: adam
  lr: 1.0e-4
  loss: bce_with_logits
  seed: 42
  device: cpu

output:
  checkpoint_dir: results/checkpoints/frequency_baseline_smoke_test/
  log_dir: results/logs/frequency_baseline_smoke_test/
