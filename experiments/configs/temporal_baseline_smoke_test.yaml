experiment: temporal_baseline_smoke_test

data:
  manifest: data/interim/manifest_temporal_baseline.csv
  train_split: data/splits/spatial_baseline_train.csv   # reused: same 50-video split, 40 train sequences
  val_split: data/splits/spatial_baseline_val.csv        # 10 val sequences

model:
  backbone: temporal_bilstm
  input_size: 512
  hidden_size: 64
  num_classes: 1          # binary, sigmoid via BCEWithLogitsLoss

train:
  epochs: 5
  batch_size: 8            # smaller than spatial/frequency's 16: only 40 train sequences
  optimizer: adam
  lr: 1.0e-4
  loss: bce_with_logits
  seed: 42
  device: cpu

output:
  checkpoint_dir: results/checkpoints/temporal_baseline_smoke_test/
  log_dir: results/logs/temporal_baseline_smoke_test/
